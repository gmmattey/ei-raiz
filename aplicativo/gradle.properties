org.gradle.jvmargs=-Xmx6144m -Xss2m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
# :shared:core:database usa cinterop CocoaPods (SQLCipher) nos alvos iOS. Cinterop com pods não
# compila em host não-mac (ver aplicativo-ci.yml, job ios-compilacao-linux). Sem esta flag, o
# Gradle recusa configurar o build inteiro fora de macOS; com ela, os alvos iOS ficam desabilitados
# graciosamente (SKIPPED) em vez de falhar, e o link real continua exclusivo do runner macOS.
kotlin.native.ignoreDisabledTargets=true
