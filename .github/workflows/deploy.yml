name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # Domínio Cloudflare Pages atual do projeto Esquilo — o Savro não tem domínio próprio ainda
  # (issue #122). Não é segredo, só o único lugar onde o valor real deveria viver. Trocar aqui
  # quando um domínio próprio for registrado; nenhum outro arquivo precisa mudar.
  PUBLIC_SITE_URL: https://ei-raiz-web.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run API tests
        run: npm run test:api

      - name: Validar URL pública do site (obrigatória para deploy)
        run: node apresentacao/scripts/checar-site-url-obrigatoria.mjs
        env:
          VITE_PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}

      - name: Deploy Frontend to Cloudflare Pages
        run: npm run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}

      - name: Deploy Backend to Cloudflare Workers
        run: npm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
