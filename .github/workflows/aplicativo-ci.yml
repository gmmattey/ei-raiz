name: Aplicativo CI

on:
  pull_request:
    branches: [master]
    paths:
      - "aplicativo/**"
      - ".github/workflows/aplicativo-ci.yml"
  workflow_dispatch:

concurrency:
  group: aplicativo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arquitetura-e-design-system:
    name: Fronteira KMP e tokens do design system
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aplicativo

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Configurar JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Verificar arquitetura e tokens
        run: ./gradlew --no-daemon --stacktrace verifyArchitecture verifyDesignSystemTokens verifyNoNetworkAccess

  testes-comuns:
    name: Testes de commonTest e módulos compartilhados
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: aplicativo

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # commonTest roda via androidUnitTest (target de teste sem device); o mesmo código de
      # teste também é validado pelo klib de iOS no job "ios-compilacao-linux".
      #
      # :shared:core:database:testDebugUnitTest cobre o contrato de persistência (Room real via
      # Robolectric, migrations) da #180 — não estava nesta lista até a #118 (lacuna da CI, não
      # escondida: a suíte já existia, só não rodava em nenhum job). :shared:core:security
      # adiciona a máquina de estados do cofre (#118, `GerenciadorCofreTest`).
      #
      # :shared:core:backup (#121) roda aqui o lado Android dos vetores compartilhados de backup —
      # o MESMO código de `commonTest` roda no simulador iOS no job "ios-xcode-macos", e é o par
      # dos dois que constitui a evidência de interoperabilidade Android <-> iOS.
      # :shared:domain:patrimonio entra junto porque a #121 mexeu em `FormatadorData`.
      # :shared:core:model entra na lista com a #130: hospeda os testes de redaction
      # (RedacaoModeloPatrimonialTest) que fixam o contrato de `toString()` dos modelos
      # patrimoniais — não estava em nenhum job de CI até aqui.
      - name: Executar testes comuns e TestKit
        run: |
          ./gradlew --no-daemon --stacktrace \
            :shared:core:model:testDebugUnitTest \
            :shared:core:testing:testDebugUnitTest \
            :shared:core:designsystem:testDebugUnitTest \
            :shared:core:database:testDebugUnitTest \
            :shared:core:security:testDebugUnitTest \
            :shared:core:backup:testDebugUnitTest \
            :shared:domain:patrimonio:testDebugUnitTest \
            :androidApp:testDevDebugUnitTest

  android-build:
    name: Lint e build de desenvolvimento Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: aplicativo

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Executar lint do app e design system
        run: ./gradlew --no-daemon --stacktrace :androidApp:lintDevDebug :shared:core:designsystem:lintDebug

      - name: Gerar APK devDebug
        run: ./gradlew --no-daemon --stacktrace :androidApp:assembleDevDebug

  ios-compilacao-linux:
    name: Compilação dos klibs iOS (sem link, sem macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: aplicativo

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # Compila commonMain/iosMain para os alvos iosArm64/iosSimulatorArm64 em runner Linux.
      # Pega quebra de compilação (tipagem, expect/actual, dependência proibida) sem precisar de
      # macOS. Não faz link do framework nem valida o projeto Xcode — isso é o job
      # "ios-xcode-macos", que exige runner macOS de verdade.
      #
      # ATUALIZADO NA #118: até a #180, este job compilava `:shared:app` (que ainda não dependia de
      # `:shared:core:database`). A #118 fez `:shared:app` passar a depender de verdade de
      # `:shared:core:database` (wiring do cofre) — e descobriu, rodando de verdade nesta CI (não
      # era só suposição), que isso quebra este job de forma dura, não silenciosa: o cinterop
      # CocoaPods do SQLCipher faz `:shared:core:database` pular (SKIPPED) seus alvos iOS aqui, mas
      # `:shared:app` continua tentando compilar contra esse klib incompleto e falha com referência
      # não resolvida (ex.: `RelogioDoSistemaIOS`) — não é warning, é `compileKotlinIosX` retornando
      # exit code 1. Por isso este job voltou a compilar só `:shared:core:security` (novo módulo da
      # #118, sem CocoaPods, compila de verdade mesmo em Linux) — `:shared:app`/`:iosApp` perderam a
      # rede de segurança deste job e passaram a depender inteiramente do "ios-xcode-macos" abaixo.
      #
      # :shared:core:backup (#121) entra nesta lista porque, como :shared:core:security, não usa
      # CocoaPods — `iosMain` fala direto com CommonCrypto, Security e UIKit via bindings de
      # plataforma do Kotlin/Native, que existem também no host Linux. É a rede de segurança barata
      # para erro de cinterop na criptografia e no seletor de arquivos do iOS, antes do runner
      # macOS.
      - name: Compilar alvos iOS (klib, sem link)
        run: |
          ./gradlew --no-daemon --stacktrace \
            :shared:core:security:compileKotlinIosArm64 \
            :shared:core:security:compileKotlinIosSimulatorArm64 \
            :shared:core:backup:compileKotlinIosArm64 \
            :shared:core:backup:compileKotlinIosSimulatorArm64

  ios-xcode-macos:
    name: Link do framework e build do Xcode (runner macOS)
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aplicativo

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # O runner macos-14 tem várias versões de Xcode instaladas em /Applications, mas o
      # xcode-select padrão aponta pra uma versão antiga (15.4, SDK iphonesimulator17.5) cujo
      # UIKit não tem a classe privada UIViewLayoutRegion/framework UIUtilities que o runtime
      # nativo do Compose Multiplatform 1.11.x referencia — o link do app (não o link do
      # framework KMP em si) falha com "Undefined symbols ... UIViewLayoutRegion". Seleciona a
      # versão de Xcode mais recente já instalada no runner (sem fixar número exato, que muda a
      # cada atualização de imagem da GitHub) pra ter um SDK com essa classe disponível.
      - name: Selecionar Xcode mais recente disponível no runner
        run: |
          latest_xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Selecionando $latest_xcode"
          sudo xcode-select -s "$latest_xcode"
          xcodebuild -version

      - name: Configurar JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # :shared:core:database usa cinterop CocoaPods (pod SQLCipher) nos alvos iOS — só compila
      # (e só resolve o pod via `pod install`) em host mac, por isso o job "ios-compilacao-linux"
      # pula esse módulo (ver comentário lá). Este é o primeiro ponto real de validação do
      # Kotlin/cinterop escrito na #180 (ProvedorChaveMestraIOS, SQLiteCifrado,
      # RepositorioItensPatrimoniaisSQLCipher) — nunca compilado antes deste job rodar.
      - name: Compilar e testar :shared:core:database no simulador iOS
        run: |
          ./gradlew --no-daemon --stacktrace \
            :shared:core:database:compileKotlinIosSimulatorArm64 \
            :shared:core:database:iosSimulatorArm64Test

      # Evidência de interoperabilidade Android <-> iOS da #121 (critério de aceite, não opcional).
      # É o MESMO `commonTest` que o job "testes-comuns" roda na JVM: o arquivo de referência
      # `VetoresDeReferencia.ARQUIVO_HEX` foi gerado pela implementação Android e aqui precisa
      # (a) abrir no iOS e (b) ser regenerado byte a byte pelo iOS. Se este passo falhar, o formato
      # divergiu entre as plataformas — não é teste de fachada.
      - name: Testar backup/restauração/CSV no simulador iOS (vetores compartilhados)
        run: ./gradlew --no-daemon --stacktrace :shared:core:backup:iosSimulatorArm64Test

      # Só o link real de framework (iosSimulatorArm64) exige host macOS; em Linux essa tarefa
      # fica SKIPPED. Roda isolado antes do Xcode pra falhar rápido e com log específico se o
      # link quebrar, sem depender do build phase do Xcode pra revelar o problema.
      - name: Linkar framework KMP (SavroApp, simulador)
        run: ./gradlew --no-daemon --stacktrace :shared:app:linkDebugFrameworkIosSimulatorArm64

      # Confirmação real (não suposição) de que a correção do PR #228 removeu a SPI privada do
      # backup: nenhum símbolo de CommonCryptorSPI.h pode aparecer no binário linkado, nem como
      # símbolo dinâmico (nm) nem como string literal (o `dlsym(handle, "CCCryptorGCMAddIV")` da
      # versão anterior embutia o nome como string no binário — `strings` pega isso mesmo sem
      # relocation de linker, já que dlsym resolve em runtime, não em link time).
      - name: Confirmar ausência de símbolo privado do CommonCrypto no framework
        run: |
          FRAMEWORK_BIN="shared/app/build/bin/iosSimulatorArm64/debugFramework/SavroApp.framework/SavroApp"
          if [ ! -f "$FRAMEWORK_BIN" ]; then
            echo "Framework não encontrado em $FRAMEWORK_BIN — ajustar o caminho do step." >&2
            exit 1
          fi
          echo "Símbolos dinâmicos (nm -m):"
          nm -m "$FRAMEWORK_BIN" | grep -i 'CCCryptorGCM\|kCCModeGCM' && { echo "Símbolo de SPI privada encontrado (nm)."; exit 1; } || echo "  nenhum encontrado."
          echo "Strings embutidas (dlsym usa string literal em runtime, não relocation):"
          strings "$FRAMEWORK_BIN" | grep -i 'CCCryptorGCM\|kCCModeGCM' && { echo "String de SPI privada encontrada (strings)."; exit 1; } || echo "  nenhuma encontrada."
          echo "Referências a dlopen/dlsym no binário (informativo — o runtime do Kotlin/Native"
          echo "pode usar dlopen internamente por motivo alheio ao backup; não falha o job sozinho,"
          echo "só documenta a contagem para leitura humana do log):"
          nm -m "$FRAMEWORK_BIN" | grep -ic 'dlopen\|dlsym' || true

      # `iosApp.xcodeproj` não tem integração CocoaPods própria — o Podfile (#118) declara o
      # SQLCipher que o SavroApp.framework espera "auto-linked" no executável final (ver
      # comentário no Podfile). `pod install` gera o `.xcworkspace` que o xcodebuild abaixo usa.
      - name: Instalar CocoaPods (SQLCipher)
        working-directory: aplicativo/iosApp
        run: pod install --repo-update

      # Build do iosApp para simulador, sem assinatura/certificado (CODE_SIGNING_ALLOWED=NO),
      # cobrindo o critério de aceite "o projeto iOS compila em simulador no runner macOS" e
      # validando a integração Gradle -> Xcode (a build phase do target roda
      # `./gradlew :shared:app:embedAndSignAppleFrameworkForXcode` de novo, agora via Xcode).
      # `-workspace`, não `-project`, a partir do Podfile (#118) — o workspace gerado pelo
      # `pod install` inclui o target `iosApp` original e o `Pods.xcodeproj`.
      - name: Build do iosApp para simulador (sem assinatura)
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Fora do escopo desta CI (documentado, não fingido como validado):
      # - build/assinatura de Release, .xcarchive ou .ipa;
      # - certificado, perfil de provisionamento ou credencial da App Store Connect;
      # - execução de testes de UI reais em simulador booted (só build, sem rodar app/testes);
      # - TestFlight ou publicação na App Store.
