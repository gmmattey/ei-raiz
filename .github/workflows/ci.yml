name: Validação de Pull Request

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipos
        run: npm run typecheck

      - name: Gerar build
        run: npm run build
        env:
          # Mesmo valor usado no deploy real (ver deploy.yml) — exercita o caminho "URL pública
          # configurada" (sitemap/robots/canonical indexáveis) também na validação de PR.
          # Não é obrigatória aqui: sem ela o build de apresentacao/ ainda passa, só gera
          # robots.txt/sitemap.xml não indexáveis (ver scripts/gerar-arquivos-seo.mjs).
          VITE_PUBLIC_SITE_URL: https://ei-raiz-web.pages.dev
          VITE_SUPPORT_EMAIL: suporte.savro@gmail.com

      - name: Impedir alterações em legado
        shell: bash
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^_legacy/'; then
            echo "::error::Esta PR altera _legacy/, que é somente leitura."
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep '^_legacy/'
            exit 1
          fi

      - name: Impedir regressão do Capacitor e do runtime patrimonial React (#184)
        run: node utilitarios/scripts/checar-legado-capacitor.mjs

      - name: Impedir artefatos de teste/relatório versionados
        shell: bash
        run: |
          # Checa arquivos rastreados pelo Git (não só o que está no workspace) — pega até
          # artefato adicionado com `git add -f` por engano, que o .gitignore sozinho não barra.
          ARTEFATOS=$(git ls-files | grep -iE '(^|/)(playwright-report|test-results)/|lighthouse-report\.(json|html)$|(^|/)\.lighthouseci/' || true)
          if [ -n "$ARTEFATOS" ]; then
            echo "::error::Artefato gerado (relatório de teste/Lighthouse) foi versionado por engano:"
            echo "$ARTEFATOS"
            exit 1
          fi
