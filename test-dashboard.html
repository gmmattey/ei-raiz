<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vera AI - Dashboard Teste</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .test-panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .test-panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .result-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .result-section h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .hero-score {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
        }

        .hero-score-number {
            font-size: 48px;
            font-weight: bold;
        }

        .hero-score-info h2 {
            margin-bottom: 10px;
        }

        .financial-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .metric {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .metric-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
        }

        .card.opportunity {
            border-left-color: #51cf66;
        }

        .card.insight {
            border-left-color: #ffd93d;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .card-detail {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .llm-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .llm-section h3 {
            color: white;
        }

        .llm-provider {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .llm-narrative {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
            line-height: 1.6;
        }

        .error {
            background: #ffe6e6;
            border: 1px solid #ff6b6b;
            color: #c92a2a;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.4;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            color: #999;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Vera AI - Dashboard Teste</h1>
            <p>Teste interativo da IA Vera com diferentes perfis financeiros e providers LLM</p>
        </div>

        <div class="test-panel">
            <h2>⚙️ Configuração do Teste</h2>

            <div class="form-group">
                <label>URL do Servidor</label>
                <input type="url" id="apiUrl" value="http://localhost:3002" />
            </div>

            <div class="form-group">
                <label>LLM Provider (opcional)</label>
                <select id="llmProvider">
                    <option value="">Nenhum (rule-based apenas)</option>
                    <option value="claude">Claude (Anthropic)</option>
                    <option value="gpt">GPT-4o (OpenAI)</option>
                    <option value="gemini">Gemini (Google)</option>
                    <option value="cloudflare">Cloudflare Workers AI</option>
                </select>
            </div>

            <h2 style="margin-top: 30px; margin-bottom: 15px;">👤 Perfil Financeiro</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Renda Mensal (R$)</label>
                    <input type="number" id="income" value="5000" />
                </div>
                <div class="form-group">
                    <label>Despesas Mensais (R$)</label>
                    <input type="number" id="expenses" value="3500" />
                </div>
                <div class="form-group">
                    <label>Idade</label>
                    <input type="number" id="age" value="35" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ativos Líquidos (R$)</label>
                    <input type="number" id="liquidAssets" value="8000" />
                </div>
                <div class="form-group">
                    <label>Dívida Total (R$)</label>
                    <input type="number" id="totalDebt" value="25000" />
                </div>
                <div class="form-group">
                    <label>Dívida de Alto Juros (R$)</label>
                    <input type="number" id="highInterestDebt" value="5000" />
                </div>
            </div>

            <div class="form-group">
                <label>Perfil de Investidor</label>
                <select id="investorProfile">
                    <option value="conservative">Conservador</option>
                    <option value="moderate" selected>Moderado</option>
                    <option value="aggressive">Agressivo</option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="analisarPerfil()">🚀 Analisar Perfil</button>
                <button class="btn-secondary" onclick="carregarExemplo('critico')">Exemplo: Crítico</button>
                <button class="btn-secondary" onclick="carregarExemplo('estavel')">Exemplo: Estável</button>
                <button class="btn-secondary" onclick="carregarExemplo('crescimento')">Exemplo: Crescimento</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analisando perfil financeiro...</p>
        </div>

        <div class="results" id="results">
            <div class="tabs">
                <button class="tab-btn active" onclick="mostrarTab('dashboard')">📊 Dashboard</button>
                <button class="tab-btn" onclick="mostrarTab('raw')">📄 JSON Bruto</button>
            </div>

            <div class="tab-content active" id="tab-dashboard">
                <div class="result-section" id="heroSection"></div>
                <div class="result-section" id="financialSection"></div>
                <div class="result-section" id="problemsSection"></div>
                <div class="result-section" id="opportunitiesSection"></div>
                <div class="result-section" id="llmSection"></div>
            </div>

            <div class="tab-content" id="tab-raw">
                <div class="result-section">
                    <h3>📋 JSON Completo</h3>
                    <div class="pre" id="jsonRaw"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function carregarExemplo(tipo) {
            const exemplos = {
                critico: {
                    income: 5000, expenses: 3500, liquidAssets: 8000,
                    totalDebt: 25000, highInterestDebt: 5000, age: 35
                },
                estavel: {
                    income: 6000, expenses: 3500, liquidAssets: 20000,
                    totalDebt: 8000, highInterestDebt: 2000, age: 35
                },
                crescimento: {
                    income: 8000, expenses: 3500, liquidAssets: 50000,
                    totalDebt: 5000, highInterestDebt: 1000, age: 35
                }
            };

            const ex = exemplos[tipo];
            document.getElementById('income').value = ex.income;
            document.getElementById('expenses').value = ex.expenses;
            document.getElementById('liquidAssets').value = ex.liquidAssets;
            document.getElementById('totalDebt').value = ex.totalDebt;
            document.getElementById('highInterestDebt').value = ex.highInterestDebt;
            document.getElementById('age').value = ex.age;
        }

        async function analisarPerfil() {
            const apiUrl = document.getElementById('apiUrl').value;
            const llmProvider = document.getElementById('llmProvider').value;

            const profile = {
                userId: `test-${Date.now()}`,
                profile: {
                    income: { value: parseInt(document.getElementById('income').value), state: "HAS_VALUE", origin: "user_input", confidence: 0.95, lastUpdated: new Date().toISOString(), isEstimated: false },
                    expenses: { value: parseInt(document.getElementById('expenses').value), state: "HAS_VALUE", origin: "user_input", confidence: 0.95, lastUpdated: new Date().toISOString(), isEstimated: false },
                    liquidAssets: { value: parseInt(document.getElementById('liquidAssets').value), state: "HAS_VALUE", origin: "user_input", confidence: 0.9, lastUpdated: new Date().toISOString(), isEstimated: false },
                    totalDebt: { value: parseInt(document.getElementById('totalDebt').value), state: "HAS_VALUE", origin: "user_input", confidence: 0.85, lastUpdated: new Date().toISOString(), isEstimated: false },
                    highInterestDebt: { value: parseInt(document.getElementById('highInterestDebt').value), state: "HAS_VALUE", origin: "user_input", confidence: 0.85, lastUpdated: new Date().toISOString(), isEstimated: false },
                    age: { value: parseInt(document.getElementById('age').value), state: "HAS_VALUE", origin: "user_input", confidence: 1.0, lastUpdated: new Date().toISOString(), isEstimated: false },
                    investorProfile: { value: document.getElementById('investorProfile').value, state: "HAS_VALUE", origin: "user_input", confidence: 0.8, lastUpdated: new Date().toISOString(), isEstimated: false },
                    goals: []
                }
            };

            if (llmProvider) {
                profile.llmProvider = llmProvider;
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');

            try {
                const response = await fetch(`${apiUrl}/api/profile/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profile)
                });

                const data = await response.json();
                document.getElementById('loading').classList.remove('active');
                document.getElementById('results').classList.add('active');

                renderDashboard(data);
                renderJSON(data);

            } catch (error) {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('results').classList.add('active');

                const section = document.getElementById('heroSection');
                section.innerHTML = `<div class="error"><strong>❌ Erro:</strong> ${error.message}</div>`;
            }
        }

        function renderDashboard(data) {
            // Hero
            const hero = data.dashboard.hero;
            document.getElementById('heroSection').innerHTML = `
                <div class="hero-score" style="background: linear-gradient(135deg, ${hero.sentiment === 'critical' ? '#ff6b6b' : '#ffd93d'} 0%, ${hero.sentiment === 'critical' ? '#ee5a6f' : '#ffb700'} 100%)">
                    <div class="hero-score-number">${hero.score}</div>
                    <div class="hero-score-info">
                        <h2>${hero.band}</h2>
                        <p>${hero.message}</p>
                    </div>
                </div>
            `;

            // Financial
            const fin = data.dashboard.financial;
            document.getElementById('financialSection').innerHTML = `
                <h3>💰 Situação Financeira</h3>
                <div class="financial-metrics">
                    <div class="metric">
                        <div class="metric-label">Renda</div>
                        <div class="metric-value">R$ ${fin.income.toLocaleString()}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Despesas</div>
                        <div class="metric-value">R$ ${fin.expenses.toLocaleString()}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Superávit</div>
                        <div class="metric-value">R$ ${fin.surplus.toLocaleString()}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Ativos Líquidos</div>
                        <div class="metric-value">R$ ${fin.liquidAssets.toLocaleString()}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Dívida Total</div>
                        <div class="metric-value">R$ ${fin.totalDebt.toLocaleString()}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Razão Dívida/Renda</div>
                        <div class="metric-value">${fin.debtRatio.toFixed(0)}%</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Meses de Cobertura</div>
                        <div class="metric-value">${fin.liquidityMonths.toFixed(1)}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Confiança da Análise</div>
                        <div class="metric-value">${(fin.confidence * 100).toFixed(0)}%</div>
                    </div>
                </div>
            `;

            // Problems
            const problems = data.dashboard.cards.problems;
            if (problems.length > 0) {
                document.getElementById('problemsSection').innerHTML = `
                    <h3>⚠️ Problemas Identificados</h3>
                    <div class="cards">
                        ${problems.map(p => `
                            <div class="card">
                                <div class="card-title">${p.icon} ${p.title}</div>
                                <div class="card-detail">${p.narrative}</div>
                                <div style="margin-top: 10px; font-size: 12px; color: #999;">
                                    ${p.metrics ? Object.entries(p.metrics).map(([k,v]) => `<div>${k}: ${v}</div>`).join('') : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Opportunities
            const opp = data.dashboard.cards.opportunities;
            if (opp.length > 0) {
                document.getElementById('opportunitiesSection').innerHTML = `
                    <h3>🎯 Oportunidades</h3>
                    <div class="cards">
                        ${opp.map(o => `
                            <div class="card opportunity">
                                <div class="card-title">${o.icon} ${o.title}</div>
                                <div class="card-detail">${o.narrative}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // LLM Narrative
            if (data.llmNarrative && data.llmMetadata) {
                const meta = data.llmMetadata;
                document.getElementById('llmSection').innerHTML = `
                    <h3 style="color: white;">🤖 Narrativa LLM Enriquecida</h3>
                    <div class="llm-provider">
                        <strong>Provider:</strong> ${meta.provider.toUpperCase()} |
                        <strong>Model:</strong> ${meta.model} |
                        <strong>Latency:</strong> ${meta.latency}ms |
                        <strong>Tokens:</strong> ${meta.tokens.total} (prompt: ${meta.tokens.prompt}, completion: ${meta.tokens.completion})
                    </div>
                    <div class="llm-narrative">
                        <strong>Análise Geral:</strong><br>
                        ${data.llmNarrative.analise_geral?.analise || 'N/A'}<br><br>
                        <strong>Ação:</strong><br>
                        ${data.llmNarrative.analise_geral?.acao || 'N/A'}
                    </div>
                `;
            }
        }

        function renderJSON(data) {
            document.getElementById('jsonRaw').textContent = JSON.stringify(data, null, 2);
        }

        function mostrarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');
        }

        // Auto-load com exemplo crítico
        carregarExemplo('critico');
    </script>
</body>
</html>
